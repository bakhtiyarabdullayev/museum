name: Publish museum to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch out/.nojekyll
      - name: Publish static website
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
      - name: Check public website
        run: |
          for path in '' 'museum/' 'collection/' 'panoramas/entrance.jpg' 'models/bronze-vessel.glb'; do
            curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
              --output /dev/null "https://bakhtiyarabdullayev.github.io/museum/${path}"
          done
